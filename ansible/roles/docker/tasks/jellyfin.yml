---
# task to setup jellyfin
- name: Create jellyfin directory
  ansible.builtin.file:
    path: "{{ dockerall.compose_files_path }}jellyfin"
    state: directory
    owner: docker
    group: docker

- name: Create jellyfin data directory
  ansible.builtin.file:
    path: "{{ dockerall.data_path }}jellyfin-data"
    state: directory
    owner: docker
    group: docker

- name: Configure jellyfin and ensure its containers are running
  block:
  - name: Copy jellyfin compose file
    template:
      src: "{{ item.src}}"
      dest: "{{ item.dest }}"
      owner: docker
      group: docker
      mode: '0644'
    loop: "{{ jellyfin.templates }}"

  - name: Ensure jellyfin containers are running
    community.docker.docker_compose_v2:
      project_src: "{{ dockerall.compose_files_path }}jellyfin"
      state: present
