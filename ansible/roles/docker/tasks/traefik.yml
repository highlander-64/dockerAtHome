---
# task to setup traefik
- name: Create traefik directory
  ansible.builtin.file:
    path: "{{ dockerall.compose_files_path }}traefik"
    state: directory
    owner: docker
    group: docker

- name: Configure traefik and ensure its containers are running
  block:
  - name: Copy traefik compose file
    template:
      src: traefik.j2
      dest: "{{ dockerall.compose_files_path }}traefik/docker-compose.yaml"
      owner: docker
      group: docker
      mode: '0644'

  - name: Ensure traefik containers are running
    community.docker.docker_compose_v2:
      project_src: "{{ dockerall.compose_files_path }}traefik"
      state: present
