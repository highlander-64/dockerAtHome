---
# task to setup gethomepage
- name: Create gethomepage directory
  ansible.builtin.file:
    path: "{{ dockerall.compose_files_path }}gethomepage"
    state: directory
    owner: docker
    group: docker

- name: Configure gethomepage and ensure its containers are running
  block:
    - name: Create gethomepage data directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: docker
        group: docker
      loop:
        - "{{ dockerall.data_path }}gethomepage-data"
        - "{{ dockerall.data_path }}gethomepage-data/images"
        - "{{ dockerall.data_path }}gethomepage-data/icons"

    - name: Copy gethomepage files
      template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: docker
        group: docker
        mode: '0644'
      loop: "{{ gethomepage.templates }}"

    - name: Ensure gethomepage containers are running
      community.docker.docker_compose_v2:
        project_src: "{{ dockerall.compose_files_path }}gethomepage"
        state: present
