---
# task to setup monitor clients like cAdvisor and node-exporter
- name: Create monitor_clients directory
  ansible.builtin.file:
    path: "{{ dockerall.compose_files_path }}monitor_clients"
    state: directory
    owner: docker
    group: docker

- name: Configure monitor_clients and ensure its containers are running
  block:
  - name: Copy monitor_clients compose file
    template:
      src: monitor_clients.j2
      dest: "{{ dockerall.compose_files_path }}monitor_clients/docker-compose.yaml"
      owner: docker
      group: docker
      mode: '0644'

  - name: Ensure monitor_clients containers are running
    community.docker.docker_compose_v2:
      project_src: "{{ dockerall.compose_files_path }}monitor_clients"
      state: present
