---
# task to setup monitor clients like cAdvisor and node-exporter
- name: Check, if docker-compose file exists
  stat:
    path: "{{ dockerall.compose_files_path }}monitor_clients/docker-compose.yaml"
  register: docker_compose

- name: Check, if one of the files will be changed
  template:
    src: "{{ item.src}}"
    dest: "{{ item.dest }}"
  check_mode: true
  loop: "{{ monitor_clients.template_check }}"
  register: template_check_result
  
- name: Create monitor_clients directory
  file:
    path: "{{ dockerall.compose_files_path }}monitor_clients"
    state: directory
    owner: docker
    group: docker
  when: not docker_compose.stat.exists

- name: Change docker configuration for monitor_clients and restart container if needed
  block:
  - name: Stop monitor_clients container
    command: docker compose down
    args:
      chdir: "{{ dockerall.compose_files_path }}monitor_clients"
    when: docker_compose.stat.exists
  
  - name: Copy monitor_clients compose file
    template:
      src: monitor_clients.j2
      dest: "{{ dockerall.compose_files_path }}monitor_clients/docker-compose.yaml"
      owner: docker
      group: docker
      mode: '0644'
  
  - name: Start monitor_clients container
    command: docker compose up -d
    args:
      chdir: "{{ dockerall.compose_files_path }}monitor_clients"

  when: template_check_result.results | selectattr('changed') | list | length > 0
