---
# task to setup mealie
- name: Create mealie directory
  ansible.builtin.file:
    path: "{{ dockerall.compose_files_path }}mealie"
    state: directory
    owner: docker
    group: docker

- name: Create mealie data directory
  ansible.builtin.file:
    path: "{{ dockerall.data_path }}mealie-data"
    state: directory
    owner: docker
    group: docker

- name: Configure mealie and ensure its containers are running
  block:
  - name: Copy mealie compose file
    template:
      src: mealie.j2
      dest: "{{ dockerall.compose_files_path }}mealie/docker-compose.yaml"
      owner: docker
      group: docker
      mode: '0644'

  - name: Ensure mealie containers are running
    community.docker.docker_compose_v2:
      project_src: "{{ dockerall.compose_files_path }}mealie"
      state: present
