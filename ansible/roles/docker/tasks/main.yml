---
- name: Initialize Docker role failure list
  ansible.builtin.set_fact:
    docker_role_failures: []

- name: Create Docker networks
  ansible.builtin.include_tasks: run_task.yml
  vars:
    docker_task_file: docker_network.yml

- name: Install scripts and systemd for backup
  ansible.builtin.include_tasks: run_task.yml
  vars:
    docker_task_file: backup.yml

- name: Install traefik
  ansible.builtin.include_tasks: run_task.yml
  vars:
    docker_task_file: traefik.yml

- name: Install fritzbox exporter
  ansible.builtin.include_tasks: run_task.yml
  vars:
    docker_task_file: fritzbox_exporter.yml

- name: Install monitor clients
  ansible.builtin.include_tasks: run_task.yml
  vars:
    docker_task_file: monitor_clients.yml

- name: Install monitor toolset
  ansible.builtin.include_tasks: run_task.yml
  vars:
    docker_task_file: monitor.yml

- name: Install mealie
  ansible.builtin.include_tasks: run_task.yml
  vars:
    docker_task_file: mealie.yml

- name: Install cops
  ansible.builtin.include_tasks: run_task.yml
  vars:
    docker_task_file: cops.yml

- name: Install wud
  ansible.builtin.include_tasks: run_task.yml
  vars:
    docker_task_file: wud.yml

- name: Install homeassistant
  ansible.builtin.include_tasks: run_task.yml
  vars:
    docker_task_file: homeassistant.yml

- name: Install gethomepage
  ansible.builtin.include_tasks: run_task.yml
  vars:
    docker_task_file: gethomepage.yml

- name: Install jellyfin
  ansible.builtin.include_tasks: run_task.yml
  vars:
    docker_task_file: jellyfin.yml

- name: Install paperless-ngx
  ansible.builtin.include_tasks: run_task.yml
  vars:
    docker_task_file: paperless-ngx.yml

- name: Fail after all Docker tasks if any task failed
  ansible.builtin.fail:
    msg: >-
      {{ docker_role_failures | length }} Docker task section(s) failed:
      {{ docker_role_failures | join('; ') }}
  when: docker_role_failures | length > 0
