---
# task to setup cops
- name: Check, if docker-compose file exists
  stat:
    path: "{{ main.docker_compose_files_path }}wud/docker-compose.yaml"
  register: docker_compose

- name: Create wud directory
  file:
    path: "{{ main.docker_compose_files_path }}wud"
    state: directory
    owner: docker
    group: docker
  when: not docker_compose.stat.exists

- name: Stop wud container
  command: docker compose down
  args:
    chdir: "{{ main.docker_compose_files_path }}wud"
  when: docker_compose.stat.exists

- name: Copy wud compose file
  template:
    src: wud.j2
    dest: "{{ main.docker_compose_files_path }}wud/docker-compose.yaml"
    owner: docker
    group: docker
    mode: '0644'

- name: Start wud container
  command: docker compose up -d
  args:
    chdir: "{{ main.docker_compose_files_path }}wud"
