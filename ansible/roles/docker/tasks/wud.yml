---
# task to setup cops
- name: Create wud directory
  ansible.builtin.file:
    path: "{{ dockerall.compose_files_path }}wud"
    state: directory
    owner: docker
    group: docker

- name: Configure wud and ensure its containers are running
  block:
  - name: Copy wud compose file
    template:
      src: wud.j2
      dest: "{{ dockerall.compose_files_path }}wud/docker-compose.yaml"
      owner: docker
      group: docker
      mode: '0644'

  - name: Ensure wud containers are running
    community.docker.docker_compose_v2:
      project_src: "{{ dockerall.compose_files_path }}wud"
      state: present
