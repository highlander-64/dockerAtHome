---
# task to setup paperless-ngx
- name: Create paperless-ngx directory
  ansible.builtin.file:
    path: "{{ dockerall.compose_files_path }}paperless-ngx"
    state: directory
    owner: docker
    group: docker

- name: Create paperless-ngx data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ nas.userid }}"
    group: "{{ nas.groupid }}"
  loop:
    - "{{ dockerall.data_path }}paperless-ngx-data"
    - "{{ paperless_ngx.mediafolder }}"
    - "{{ paperless_ngx.consumefolder }}"
    - "{{ paperless_ngx.exportfolder }}"

- name: Configure paperless-ngx and ensure its containers are running
  block:
    - name: Copy paperless-ngx compose file
      template:
        src: "{{ item.src}}"
        dest: "{{ item.dest }}"
        owner: docker
        group: docker
        mode: '0644'
      loop: "{{ paperless_ngx.templates }}"

    - name: Ensure paperless-ngx containers are running
      community.docker.docker_compose_v2:
        project_src: "{{ dockerall.compose_files_path }}paperless-ngx"
        state: present
