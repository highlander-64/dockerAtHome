---
# task to setup homeassistant
- name: Create homeassistant directory
  ansible.builtin.file:
    path: "{{ dockerall.compose_files_path }}homeassistant"
    state: directory
    owner: docker
    group: docker

- name: Create homeassistant data directory
  ansible.builtin.file:
    path: "{{ dockerall.data_path }}homeassistant"
    state: directory
    owner: docker
    group: docker

- name: Configure homeassistant and ensure its containers are running
  block:
    - name: Copy homeassistant compose file
      template:
        src: homeassistant.j2
        dest: "{{ dockerall.compose_files_path }}homeassistant/docker-compose.yaml"
        owner: docker
        group: docker
        mode: '0644'

    - name: Ensure homeassistant containers are running
      community.docker.docker_compose_v2:
        project_src: "{{ dockerall.compose_files_path }}homeassistant"
        state: present
