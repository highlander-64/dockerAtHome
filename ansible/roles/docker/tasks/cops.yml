---
# task to setup cops
- name: Create cops directory
  ansible.builtin.file:
    path: "{{ dockerall.compose_files_path }}cops"
    state: directory
    owner: docker
    group: docker

- name: Configure cops and ensure its containers are running
  block:
    - name: Copy cops compose file
      template:
        src: "{{ item.src}}"
        dest: "{{ item.dest }}"
        owner: docker
        group: docker
        mode: '0644'
      loop: "{{ cops.templates }}"

    - name: Ensure cops containers are running
      community.docker.docker_compose_v2:
        project_src: "{{ dockerall.compose_files_path }}cops"
        state: present
