---
# task to setup fritzbox-exporter
- name: Check, if docker-compose file exists
  stat:
    path: "{{ dockerall.compose_files_path }}fritzbox_exporter/docker-compose.yaml"
  register: docker_compose

- name: Check, if one of the files will be changed
  template:
    src: "{{ item.src}}"
    dest: "{{ item.dest }}"
  check_mode: true
  loop: "{{ fritzbox_exporter.template_check }}"
  register: template_check_result

- name: Create fritzbox_exporter directory
  file:
    path: "{{ dockerall.compose_files_path }}fritzbox_exporter"
    state: directory
    owner: docker
    group: docker
  when: not docker_compose.stat.exists

- name: Change docker configuration for fritzbox_exporter and restart container if needed
  block:
    - name: Stop fritzbox_exporter container
      command: docker compose down
      args:
        chdir: "{{ dockerall.compose_files_path }}fritzbox_exporter"
      when: docker_compose.stat.exists

    - name: Copy fritzbox_exporter compose file
      template:
        src: fritzbox_exporter.j2
        dest: "{{ dockerall.compose_files_path }}fritzbox_exporter/docker-compose.yaml"
        owner: docker
        group: docker
        mode: '0644'
    
    - name: Start fritzbox_exporter container
      command: docker compose up -d
      args:
        chdir: "{{ dockerall.compose_files_path }}fritzbox_exporter"

  when: template_check_result.results | selectattr('changed') | list | length > 0
