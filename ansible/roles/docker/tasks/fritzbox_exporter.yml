---
# task to setup fritzbox-exporter
- name: Create fritzbox_exporter directory
  ansible.builtin.file:
    path: "{{ dockerall.compose_files_path }}fritzbox_exporter"
    state: directory
    owner: docker
    group: docker

- name: Configure fritzbox_exporter and ensure its containers are running
  block:
    - name: Copy fritzbox_exporter compose file
      template:
        src: fritzbox_exporter.j2
        dest: "{{ dockerall.compose_files_path }}fritzbox_exporter/docker-compose.yaml"
        owner: docker
        group: docker
        mode: '0644'

    - name: Ensure fritzbox_exporter containers are running
      community.docker.docker_compose_v2:
        project_src: "{{ dockerall.compose_files_path }}fritzbox_exporter"
        state: present
