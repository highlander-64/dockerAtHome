---
# task to setup monitor toolset with Grafana and Prometheus
- name: Create monitor directory
  ansible.builtin.file:
    path: "{{ dockerall.compose_files_path }}monitor"
    state: directory
    owner: docker
    group: docker

- name: Create monitor data directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: docker
    group: docker
  loop:
    - "{{ dockerall.data_path }}monitor"
    - "{{ dockerall.data_path }}monitor/grafana"
    - "{{ dockerall.data_path }}monitor/prometheus"

- name: Configure monitor and ensure its containers are running
  block:
    - name: Copy monitor compose and Prometheus configuration files
      template:
        src: "{{ item.src}}"
        dest: "{{ item.dest }}"
        owner: docker
        group: docker
        mode: '0644'
      loop: "{{ monitor.templates }}"
      register: monitor_template_result

    - name: Ensure monitor containers are running
      community.docker.docker_compose_v2:
        project_src: "{{ dockerall.compose_files_path }}monitor"
        state: present

    - name: Restart Prometheus when its configuration changes
      community.docker.docker_compose_v2:
        project_src: "{{ dockerall.compose_files_path }}monitor"
        services:
          - prometheus
        recreate: always
      when: >-
        monitor_template_result.results
        | selectattr('item.src', 'equalto', 'prometheus.j2')
        | selectattr('changed')
        | list
        | length > 0
