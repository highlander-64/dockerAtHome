---
# task to setup monitor toolset with Grafana and Prometheus
- name: Check, if docker-compose file exists
  stat:
    path: "{{ dockerall.compose_files_path }}monitor/docker-compose.yaml"
  register: docker_compose

- name: Check, if one of the files will be changed
  template:
    src: "{{ item.src}}"
    dest: "{{ item.dest }}"
  check_mode: true
  loop: "{{ monitor.template_check }}"
  register: template_check_result
  
- name: Create monitor directory
  file:
    path: "{{ dockerall.compose_files_path }}monitor"
    state: directory
    owner: docker
    group: docker
  when: not docker_compose.stat.exists

- name: Check, if monitor data folder exists
  stat:
    path: "{{ dockerall.data_path }}monitor"
  register: monitor_data

- name: Create monitor data directory
  file:
    path: "{{ item }}"
    state: directory
    owner: docker
    group: docker
  loop:
    - "{{ dockerall.data_path }}monitor"
    - "{{ dockerall.data_path }}monitor/grafana"
    - "{{ dockerall.data_path }}monitor/prometheus"
  when: not monitor_data.stat.exists

- name: Change docker configuration for monitor and restart container if needed
  block:
  - name: Stop monitor container
    command: docker compose down
    args:
      chdir: "{{ dockerall.compose_files_path }}monitor"
    when: docker_compose.stat.exists

  - name: Copy monitor compose file
    template:
      src: "{{ item.src}}"
      dest: "{{ item.dest }}"
      owner: docker
      group: docker
      mode: '0644'
    loop: "{{ monitor.template_check }}"
  
  - name: Start monitor container
    command: docker compose up -d
    args:
      chdir: "{{ dockerall.compose_files_path }}monitor"

  when: template_check_result.results | selectattr('changed') | list | length > 0
