---
# vars file for docker

backup:
  backup_path: /mnt/backup/docker
  backup_filename: docker-backup.sh
  restore_filename: docker-restore.sh
  control_filename: docker-backup-control.sh
  systemd_name: docker-data-backup
  systemd_time: "03:30:00"

# Set version for each docker compose file
docker:
  cops: version-4.3.3
  fritzbox_exporter: 2589dd69e722ba2d0c6841e348bbc4b7bdb361d9
  homeassistant: stable
  mealie: v3.19.2
  cadvisor: v0.55.1
  node_exporter: v1.11.1
  grafana: 13.1.0-25893932881-ubuntu
  prometheus: v3.12.0
  traefik: v3.7.1
  wud: 8.2.2
  socket_proxy: v0.4.2
  gethomepage: v1.13.1

fritzbox_exporter:
  user: monitor
  password: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          35306137633463643365666366343533343935363537373531373862643838363532376635333838
          6537613865316361663066306637346439326363633332620a663236383836376437396232663537
          61313061663935666266316435326362383762626332663132366630656639303361663533373661
          3132663961663537340a383132333265376637343139343235343762316464663365323230333164
          66383562396135316637633730633639646332663366336266633736356638613335
  gateway: http://192.168.10.1:49000

gethomepage:
  config_files:
    - template: gethomepage-settings.j2
      dest: "{{ dockerall.data_path }}gethomepage/settings.yaml"
    - template: gethomepage-docker.j2
      dest: "{{ dockerall.data_path }}gethomepage/docker.yaml"
    - template: gethomepage-services.j2
      dest: "{{ dockerall.data_path }}gethomepage/services.yaml"
    - template: gethomepage-widgets.j2
      dest: "{{ dockerall.data_path }}gethomepage/widgets.yaml"