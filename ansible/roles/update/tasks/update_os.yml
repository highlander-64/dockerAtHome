---
# Update OS based on Debian/Ubuntu
- name: Update apt repo and cache on all Debian/Ubuntu machines
  apt: update_cache=yes force_apt_get=yes cache_valid_time=360

- name: Upgrade all packages on servers
  apt: upgrade=dist force_apt_get=yes

- name: Check if a reboot is needed on all servers
  stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: Stop all containers
  ansible.builtin.script:
    cmd: ./docker-control.sh stop
    chdir: "{{ mydocker.path }}"
  when: reboot_required_file.stat.exists

- name: Reboot if kernel updated
  reboot:
    msg: "Reboot initiated by Ansible for kernel updates"
    connect_timeout: 5
    reboot_timeout: 300
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: uptime
  when: reboot_required_file.stat.exists

- name: Start all containers
  ansible.builtin.script:
    cmd: ./docker-control.sh start
    chdir: "{{ mydocker.path }}"
  when: reboot_required_file.stat.exists